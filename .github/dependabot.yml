version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /hack/controller-gen/
      - /hack/api-group-resources/
    schedule:
      interval: daily
    rebase-strategy: disabled
    groups:
      kubernetes:
        patterns:
          - k8s.io/*
      sigstore:
        patterns:
          - github.com/sigstore/sigstore/*
      otel:
        patterns:
          - go.opentelemetry.io/*
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*/
      - /.github/actions/*/*/
      - /.github/actions/*/*/*/
    schedule:
      interval: daily
    rebase-strategy: disabled
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker
    directory: /.oss-scanner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: helm
    directories:
    - /charts/kyverno
    - /charts/kyverno-policies
    - /charts/kyverno/charts/crds
    - /charts/kyverno/charts/grafana
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
